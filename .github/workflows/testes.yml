name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (unitários + ponta a ponta com Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -v

  demo:
    name: Demo completa (portais + launcher)
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: cp .env.example .env
      - name: Dia comum
        run: python demo.py --data 2026-11-17
      - name: Dia 1 (mês fechado)
        run: python demo.py --data 2026-12-01
